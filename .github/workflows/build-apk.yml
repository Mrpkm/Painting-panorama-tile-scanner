name: Setup Android SDK
  uses: android-actions/setup-android@v3
  with:
    api-level: 34  # Adjust to your target API level
    build-tools-version: '34.0.0'  # Adjust to match your build.gradle
    ndk-version: '26.1.10909125'  # Optional: only if you need NDK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: PhotoMosaicScanner
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMosaicScanner-debug-apk
          path: PhotoMosaicScanner/app/build/outputs/apk/debug/app-debug.apk
