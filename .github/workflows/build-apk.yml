name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:${PATH}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK cmdline tools
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd /tmp
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT"

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/bin" ]; then
            echo "cmdline-tools already installed"
          else
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            tmp_dir=$(find "$ANDROID_SDK_ROOT" -maxdepth 2 -type d -name "cmdline-tools*" | head -n 1)
            if [ -n "$tmp_dir" ]; then
              cp -a "$tmp_dir"/. "$ANDROID_SDK_ROOT/cmdline-tools/"
            fi
          fi

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMosaicScanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
